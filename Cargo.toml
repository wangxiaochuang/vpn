[package]
name = "vpn"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = { version = "0.11", features = ["rustls-aws-lc-rs"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws_lc_rs",
] }
rustls-pki-types = "1"
clap = { version = "4", features = ["derive"] }
tun-rs = { version = "2", features = ["async"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14.8"
bytes = "1"
thiserror = "2"
tokio-util = { version = "0.7", features = ["codec"] }
ipnet = "2"
prost = "0.13"
getrandom = "0.2"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
