[package]
name = "sysprobe"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13"
tokio = { version = "1", features = ["full", "rt", "macros"] }
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
