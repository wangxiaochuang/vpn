[package]
name = "quic-link"
license = "MIT"
version = "0.1.0"
edition = "2024"

[dependencies]
msgx = { path = "../msgx" }
shutdown = { path = "../shutdown" }
quinn = { version = "0.11", features = ["rustls-aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws_lc_rs",
] }
rustls-pki-types = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
prost = "0.13"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
