schema: spec-driven

context: |
  基于 QUIC 的 VPN（Rust，edition 2024）。
  技术栈：quinn / rustls(aws-lc-rs) / tun-rs / tokio / prost / clap / argon2
  架构见 doc/arch-v1.md：控制面 QUIC stream + length-prefix framing，
  数据面 QUIC datagram 原样转发 IP 包。
  测试策略见 AGENTS.md：四象限模型，spec 场景与 vpn/tests/ 绑定。

rules:
  proposal:
    - 必须标注涉及的测试象限（Q1/Q2/Q3/Q4）
    - 必须列出非目标（Non-goals）
  spec:
    - 每个需求必须写成 Given/When/Then 格式
    - 每个场景必须对应 vpn/tests/ 下一个自动化测试
  design:
    - 涉并发的部分必须说明 cancel-safety
    - 引入新依赖前先确认无既有方案
  tasks:
    - 每个任务标注所属象限
    - Q1/Q2 任务必须含「测试先行」步骤
