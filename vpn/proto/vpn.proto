syntax = "proto3";

package vpn;

message ControlMessage {
  oneof msg {
    AuthRequest auth_request = 1;
    AuthOk auth_ok = 2;
    AuthDenied auth_denied = 3;
    Heartbeat heartbeat = 4;
    Disconnect disconnect = 5;
  }
}

message AuthRequest {
  string username = 1;
  string password = 2;
}

message AuthOk {
  string assigned_ip = 1;
  string subnet = 2;
  string gateway = 3;
  uint32 mtu = 4;
  repeated string routes = 5;
}

message AuthDenied {
  DenyReason reason = 1;
}

enum DenyReason {
  AUTH_FAILED = 0;
  SERVER_BUSY = 1;
}

message Heartbeat {}

message Disconnect {
  string reason = 1;
}
